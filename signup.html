<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ESCAPEQUEST</title>
    <meta name="description" content="Register as a new agent and start your immersive adventure.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- Styles -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/premium.css">
</head>
<body class="auth-page">
    <canvas id="particles-canvas"></canvas>

    <div class="auth-card">
        <!-- Toggles -->
        <div class="auth-controls">
            <button id="rtl-toggle" class="auth-toggle-btn" title="Toggle RTL">
                RTL
            </button>
            <button id="theme-toggle" class="auth-toggle-btn" title="Toggle Theme">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <!-- Logo -->
        <div class="auth-logo">
            <a href="index.html">
                <i class="fas fa-key logo-icon"></i>
                <h2>ESCAPEQUEST</h2>
            </a>
        </div>

        <div class="auth-header">
            <h1>User Registration</h1>
        </div>

        <!-- Signup Form -->
        <form class="auth-form" action="dashboard.html" method="GET">
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user field-icon"></i>
                    <input type="text" id="fullname" class="auth-input" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">User Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope field-icon"></i>
                    <input type="email" id="email" class="auth-input" placeholder="user@escapequest.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock field-icon"></i>
                    <input type="password" id="password" class="auth-input" placeholder="Create a strong password" required>
                    <i class="fas fa-eye password-toggle"></i>
                </div>
            </div>


            <button type="submit" class="auth-btn">continue</button>
        </form>

        <!-- Social Logins -->
        <div class="social-separator">
            <span>Or join with</span>
        </div>

        <div class="social-buttons">
            <button class="social-btn">
                <i class="fab fa-google" style="color: #4285F4;"></i>
                <span>Google</span>
            </button>
            <button class="social-btn">
                <i class="fab fa-apple"></i>
                <span>Apple</span>
            </button>
        </div>

        <div class="auth-footer">
            Already a user? <a href="login.html">Sign In Here</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/particles.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
